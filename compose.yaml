services:
  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-demo-key-change-for-deployment}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    command: >
      sh -c "if [ ! -f /data/db.sqlite3 ]; then
               python manage.py migrate &&
               python manage.py seed_data &&
               python manage.py setup_demo &&
               touch /data/.seeded;
             else
               python manage.py migrate;
             fi &&
             touch /app/.demo-enabled &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  dispatch_worker:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-demo-key-change-for-deployment}
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
    depends_on:
      backend:
        condition: service_healthy
    command: python manage.py check_stalled_orders --loop --interval 30
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
